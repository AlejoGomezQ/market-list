name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      # Fase 7: Playwright con el escenario completo, contra Supabase LOCAL (Docker), nunca el
      # proyecto remoto -- create_household hace una llamada RPC real. `supabase/setup-cli` +
      # `supabase start` en vez de levantar el stack a mano con `docker compose`: es el mismo
      # camino que ya usa el desarrollo local (`pnpm exec supabase start`), un runner de
      # `ubuntu-latest` trae Docker de fábrica, y así no hay un segundo docker-compose.yml que
      # mantener sincronizado con `supabase/config.toml`.
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase local
        run: supabase start

      # `supabase status -o env` imprime las claves generadas localmente (deterministas: mismo
      # `supabase-demo` JWT secret siempre, así que no son secretos que proteger) -- se leen aquí
      # en vez de fijarlas a mano en el workflow para no tener un valor stale si el CLI cambia
      # cómo las deriva.
      - name: Configurar variables de Supabase para el build
        run: |
          STATUS=$(supabase status -o env)
          echo "VITE_SUPABASE_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Instalar navegador de Playwright (WebKit de escritorio)
        run: pnpm exec playwright install --with-deps webkit

      - name: Playwright
        run: pnpm run test:e2e
